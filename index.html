<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dojang Agadir</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: dark sidebar + light content; mobile = top bar with hamburger drawer. */
:root {
  --side: #1f2937; --side-fg: #cbd5e1; --side-active: #111827;
  --bg: #f4f6fb; --card: #ffffff; --line: #e5e7eb; --fg: #111827; --muted: #6b7280;
  --primary: #4f46e5; --primary-fg: #fff;
  --green: #22c55e; --amber: #f59e0b; --red: #ef4444; --blue: #3b82f6; --pink: #ec4899; --teal: #10b981; --sky: #0ea5e9; --slate: #64748b; --orange: #f97316; --brown: #b45309; --wine: #b91c1c;
  --radius: 12px; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --font: "DM Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; }
h1,h2,h3,h4 { margin: 0; font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); }
[hidden] { display: none !important; }
[dir=rtl] { text-align: right; }
.app { display: grid; grid-template-columns: 230px 1fr; min-height: 100%; }
/* Sidebar */
.sidecol { background: var(--side); }
.side { background: var(--side); color: var(--side-fg); padding: 16px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 18px; color: #fff; }
.brand .logo { width: 36px; height: 36px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; overflow: hidden; }
.brand .logo svg { width: 24px; height: 24px; }
.brand .name { font-weight: 700; font-size: 13px; line-height: 1.2; text-transform: uppercase; letter-spacing: .02em; }
.nav button { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; color: var(--side-fg); padding: 9px 12px; border-radius: 8px; cursor: pointer; text-align: start; font-weight: 500; font-size: 13.5px; }
.nav button svg { width: 16px; height: 16px; flex: none; opacity: .85; }
.nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav button[aria-current=page] { background: var(--side-active); color: #fff; box-shadow: inset 3px 0 0 var(--primary); }
[dir=rtl] .nav button[aria-current=page] { box-shadow: inset -3px 0 0 var(--primary); }
/* Topbar */
.top { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
.top .title { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.top .title svg { width: 18px; height: 18px; color: var(--primary); }
.burger { display: none; background: var(--side); color: #fff; border: 0; border-radius: 8px; width: 38px; height: 38px; cursor: pointer; }
.langs { display: flex; gap: 6px; }
.langs button { border: 2px solid transparent; border-radius: 4px; padding: 0; width: 30px; height: 22px; cursor: pointer; background: none; overflow: hidden; }
.langs button.on { border-color: var(--primary); }
.langs svg { width: 100%; height: 100%; display: block; }
.bell { position: relative; background: none; border: 0; cursor: pointer; width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; }
.bell svg { width: 18px; height: 18px; }
.bell .n { position: absolute; top: 2px; right: 2px; background: var(--red); color: #fff; font-size: 10px; font-weight: 700; border-radius: 999px; padding: 1px 5px; }
main { padding: 20px; min-width: 0; }
.page { display: none; } .page.active { display: block; }
/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 18px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; gap: 12px; align-items: center; cursor: pointer; box-shadow: var(--shadow); text-align: start; }
.tile:hover { border-color: #c7d2fe; }
.tile .ic { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; }
.tile .ic svg { width: 20px; height: 20px; }
.tile b { display: block; font-size: 15px; }
.tile small { color: var(--muted); font-size: 12px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; gap: 12px; align-items: center; cursor: pointer; text-align: start; }
.stat.on { outline: 2px solid var(--primary); }
.stat .ic { width: 38px; height: 38px; border-radius: 9px; color: #fff; display: grid; place-items: center; flex: none; }
.stat .ic svg { width: 18px; height: 18px; }
.stat b { font-size: 20px; display: block; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; }
/* Cards & grid */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { font-size: 15px; }
.card .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.donut { width: 150px; height: 150px; border-radius: 50%; margin: 6px auto; position: relative; display: grid; place-items: center; }
.donut::before { content: ""; position: absolute; inset: 30px; background: var(--card); border-radius: 50%; }
.donut .c { position: relative; text-align: center; }
.donut .c b { font-size: 20px; display: block; line-height: 1; }
.donut .c small { color: var(--muted); font-size: 11px; }
.beltlist { display: flex; flex-direction: column; gap: 6px; }
.beltlist .r { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.beltlist .r .sw { width: 30px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); flex: none; position: relative; overflow: hidden; }
.beltlist .r .sw i { position: absolute; left: 0; right: 0; top: 50%; height: 4px; transform: translateY(-50%); }
.beltlist .r .sw.black i { background: #000; }
.beltlist .r .lb { flex: 1; }
.beltlist .r .mini { width: 18px; height: 6px; border-radius: 2px; border: 1px solid rgba(0,0,0,.15); }
.beltlist .r b { width: 28px; text-align: end; font-variant-numeric: tabular-nums; }
/* Toolbar, buttons, tables */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar .grow { flex: 1 1 200px; }
.toolbar select, .toolbar input[type=date], .toolbar input[type=month] { width: auto; flex: 0 1 220px; }
input, select, textarea { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
select { appearance: auto; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: #f9fafb; }
.btn.p { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn.p:hover { background: #4338ca; }
.btn.r { background: var(--red); color: #fff; border-color: var(--red); }
.btn.g { background: var(--green); color: #fff; border-color: var(--green); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn.ghost { border-color: transparent; background: none; color: var(--primary); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 14px; height: 14px; }
.tw { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 12px; text-align: start; border-top: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
th { border-top: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: #f8fafc; }
.av { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #f97316, #ef4444); color: #fff; font-weight: 700; font-size: 12px; display: inline-grid; place-items: center; flex: none; }
.pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill.g { background: #dcfce7; color: #15803d; } .pill.a { background: #fef3c7; color: #b45309; } .pill.r { background: #fee2e2; color: #b91c1c; } .pill.b { background: #dbeafe; color: #1d4ed8; } .pill.n { background: #f1f5f9; color: var(--muted); }
.badge { display: inline-block; min-width: 26px; text-align: center; padding: 3px 7px; border-radius: 6px; color: #fff; font-weight: 700; font-size: 12px; }
.badge.g { background: var(--green); } .badge.a { background: var(--amber); } .badge.r { background: var(--red); }
.belt { display: inline-flex; align-items: center; gap: 6px; }
.belt .sw { width: 22px; height: 9px; border-radius: 2px; border: 1px solid rgba(0,0,0,.15); position: relative; overflow: hidden; }
.belt .sw i { position: absolute; left: 0; right: 0; top: 50%; height: 3px; transform: translateY(-50%); }
.empty { color: var(--muted); padding: 24px; text-align: center; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.ph p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
/* Forms / modals */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(680px, calc(100% - 24px)); max-height: calc(100% - 24px); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(17,24,39,.5); }
dialog form, dialog .body { padding: 20px; }
dialog h2 { font-size: 17px; margin-bottom: 14px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fields .full { grid-column: 1 / -1; }
.f label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.f .hint { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.ff { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.ff .right { display: flex; gap: 8px; margin-inline-start: auto; }
.chk { display: flex; align-items: center; gap: 8px; }
.chk input { width: 18px; height: 18px; accent-color: var(--primary); padding: 0; }
.section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.section h3 { font-size: 14px; margin-bottom: 8px; }
.dl { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; margin: 12px 0; }
.dl dt { color: var(--muted); } .dl dd { margin: 0; overflow-wrap: anywhere; }
.info { background: #eef2ff; color: #3730a3; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-top: 10px; }
.warn { background: #fef3c7; color: #92400e; border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.attn { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.attn label { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.attn label.on { border-color: var(--green); background: #f0fdf4; }
.attn label .m { font-size: 12px; color: var(--muted); }
.bars { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; align-items: end; height: 160px; padding-top: 8px; }
.bars .b { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.bars .b .v { font-size: 10.5px; color: var(--muted); }
.bars .b .st { width: 100%; max-width: 48px; display: flex; gap: 3px; align-items: flex-end; height: 100%; }
.bars .b .st i { flex: 1; border-radius: 3px 3px 0 0; min-height: 2px; display: block; }
.bars .b .l { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.editlist { display: flex; flex-direction: column; gap: 8px; }
.editlist .it { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr auto; gap: 8px; align-items: center; }
.editlist .it.s2 { grid-template-columns: 1fr 90px auto; }
.qrwrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
video { width: 100%; max-width: 100%; border-radius: 10px; background: #000; aspect-ratio: 4/3; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: 500; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: none; }
/* Login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: linear-gradient(160deg, #1f2937, #4f46e5); }
.login .box { background: #fff; border-radius: 16px; padding: 28px; width: min(380px, 100%); box-shadow: 0 25px 60px rgba(0,0,0,.35); }
.login .box h1 { font-size: 20px; margin-bottom: 4px; }
.login .box p { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
.qrbox { display: grid; grid-template-columns: repeat(auto-fill, 1fr); }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidecol { display: contents; }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: 250px; z-index: 30; transform: translateX(-100%); transition: transform .2s; }
  [dir=rtl] .side { left: auto; right: 0; transform: translateX(100%); }
  .side.open { transform: none; }
  .scrim.open { display: block; }
  .burger { display: grid; place-items: center; }
  main { padding: 14px; }
  .fields { grid-template-columns: 1fr; }
  .dl { grid-template-columns: 1fr; gap: 2px; } .dl dt { margin-top: 8px; }
  .editlist .it, .editlist .it.s2 { grid-template-columns: 1fr 1fr; }
  .tile b { font-size: 14px; }
  .top { padding: 8px 12px; gap: 8px; }
  .top .title span:last-child { display: none; }
  #logout span { display: none; }
  #logout { padding: 8px; }
  .tiles { grid-template-columns: 1fr 1fr; }
  .tile { flex-direction: column; align-items: flex-start; gap: 8px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="login" id="login">
  <form class="box" id="loginForm">
    <div class="brand" style="color:var(--fg);padding:0 0 14px"><div class="logo" style="background:var(--side)"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-1.5z"/></svg></div><div class="name" id="loginClub">Dojang Agadir</div></div>

</div>

<div class="app" id="app" hidden>

  <div class="sidecol"><aside class="side" id="side">

    <nav class="nav" id="nav"></nav>

  <div style="min-width:0">
    <header class="top">

      <div class="title"><span id="topIcon"></span><span id="topTitle"></span></div>

      <div class="langs" id="langs"></div>
      <button class="btn sm" id="logout"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 13v-2H7V8l-5 4 5 4v-3zm4-10H10a2 2 0 0 0-2 2v3h2V5h10v14H10v-3H8v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg><span data-i18n="logout">Déconnexion</span></button>
    </header>
    <main id="main"></main>
  </div>
</div>

<dialog id="dlg"><div id="dlgBody"></div></dialog>
<dialog id="dlgConfirm"><form method="dialog"><h2 id="cTitle"></h2><p id="cText" style="margin:0"></p><div class="ff"><div class="right"><button value="no" class="btn" data-i18n="cancel">Annuler</button><button value="yes" class="btn r" id="cYes"></button></div></div></form></dialog>
<div class="toast" id="toast" role="status"></div>

P.subs = () => {

  if (filters.q) rows = rows.filter(m => fullName(m).toLowerCase().includes(filters.q.toLowerCase()));

  const st = (k, n, l, c, ic) => `<button class="stat ${filters.subFilter === k ? 'on' : ''}" data-f="${k}"><span class="ic" style="background:${c}">${svg(ic)}</span><span><b>${n}</b><small>${l}</small></span></button>`;

  <div class="toolbar"><input class="grow" type="search" id="q" value="${esc(filters.q)}" placeholder="${t('search')}…">${sportSelect('fSport', filters.sport, t('allSports'))}</div>

P.fin = () => { const mo = filters.finMonth; const pays = Object.values(D.payments).filter(p => (p.date || '').startsWith(mo)); const exps = Object.values(D.expenses).filter(e => (e.date || '').startsWith(mo)); const rev = sum(pays, p => p.amount), ex = sum(exps, e => e.amount); const months = []; const d = new Date(); d.setDate(1); for (let i = 5; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); const key = `${x.getFullYear()}-${pad(x.getMonth() + 1)}`; months.push({ key, l: x.toLocaleDateString(LANG === 'ar' ? 'ar-MA' : LANG === 'en' ? 'en-GB' : 'fr-FR', { month: 'short' }), r: sum(Object.values(D.payments).filter(p => (p.date || '').startsWith(key)), p => p.amount), e: sum(Object.values(D.expenses).filter(p => (p.date || '').startsWith(key)), p => p.amount) }); } const max = Math.max(1, ...months.map(m => Math.max(m.r, m.e)));

  return `<div class="ph"><div><h2>${t('nav.fin')}</h2><p>${t('fin.sub')}</p></div><div class="actions"><input type="month" id="fM" value="${mo}" style="width:auto"><button class="btn r" id="newE">+ ${t('exp.new')}</button></div></div>
  <div class="stats"><div class="stat"><span class="ic" style="background:#22c55e">${svg('fin')}</span><span><b>${money(rev)}</b><small>${t('revenue')}</small></span></div><div class="stat"><span class="ic" style="background:#ef4444">${svg('fin')}</span><span><b>${money(ex)}</b><small>${t('expenses')}</small></span></div><div class="stat"><span class="ic" style="background:${rev - ex >= 0 ? '#4f46e5' : '#f59e0b'}">${svg('fin')}</span><span><b>${money(rev - ex)}</b><small>${t('balance')}</small></span></div></div>

P.prices = () => `<div class="ph"><div><h2>${t('nav.prices')}</h2><p>${t('prices.sub')}</p></div></div><form class="card" id="prf"><div class="f" style="max-width:260px;margin-bottom:14px"><label>${t('inscriptionFee')}</label><input id="prFee" type="number" min="0" value="${D.settings.inscriptionFee}"></div><div class="editlist" id="plans">${D.settings.plans.map((p, i) => `<div class="it" data-i="${i}"><input data-k="name" value="${esc(p.name)}" placeholder="${t('name')}">${sportSelect('ps' + i, p.sportId, t('allSports')).replace('<select', '<select data-k="sportId"')}<input data-k="months" type="number" min="1" value="${p.months}" placeholder="${t('months')}"><input data-k="price" type="number" min="0" value="${p.price}" placeholder="${t('price')}"><button type="button" class="btn sm" data-rm="${i}">✕</button></div>`).join('')}</div><div class="actions" style="margin-top:10px"><button type="button" class="btn sm" id="addPlan">${t('prices.add')}</button></div><div class="ff"><div class="right"><button class="btn p">${t('save')}</button></div></div></form>`;
function readPlans() { D.settings.inscriptionFee = +$('#prFee').value || 0; D.settings.plans = $$('#plans .it').map((it, i) => ({ id: D.settings.plans[i]?.id || uid('p'), name: $('[data-k=name]', it).value.trim(), sportId: $('[data-k=sportId]', it).value, months: Math.max(1, +$('[data-k=months]', it).value || 1), price: +$('[data-k=price]', it).value || 0 })); }
P.prices_wire = () => { $('#addPlan').addEventListener('click', () => { readPlans(); D.settings.plans.push({ id: uid('p'), name: '', sportId: '', months: 1, price: 0 }); render(); }); $$('[data-rm]').forEach(b => b.addEventListener('click', () => { readPlans(); D.settings.plans.splice(+b.dataset.rm, 1); render(); })); $('#prf').addEventListener('submit', ev => { ev.preventDefault(); readPlans(); D.settings.plans = D.settings.plans.filter(p => p.name); save(); toast(t('saved')); }); };

P.settings = () => `<div class="ph"><div><h2>${t('nav.settings')}</h2></div></div><form class="card" id="sf"><div class="fields"><div class="f"><label>${t('clubName')}</label><input id="sName" value="${esc(D.settings.clubName)}"></div><div class="f"><label>${t('password')}</label><input id="sPass" type="text" value="${esc(D.settings.password)}"></div></div><div class="section"><h3>${t('sports')}</h3><div class="editlist" id="sports">${D.settings.sports.map((s, i) => `<div class="it s2" data-i="${i}"><input data-k="name" value="${esc(s.name)}" placeholder="${t('name')}"><input data-k="color" type="color" value="${s.color}" style="padding:2px;height:36px"><label class="chk" style="white-space:nowrap"><input data-k="belts" type="checkbox" ${s.belts !== false ? 'checked' : ''}>${t('belt')}</label><button type="button" class="btn sm" data-rm="${i}">✕</button></div>`).join('')}</div><button type="button" class="btn sm" id="addSport" style="margin-top:8px">${t('sports.add')}</button></div><div class="ff"><div class="right"><button class="btn p">${t('save')}</button></div></div></form>

function readSports() { D.settings.clubName = $('#sName').value.trim() || 'Club'; D.settings.password = $('#sPass').value; D.settings.sports = $$('#sports .it').map((it, i) => ({ id: D.settings.sports[i]?.id || uid('s'), name: $('[data-k=name]', it).value.trim(), color: $('[data-k=color]', it).value, belts: $('[data-k=belts]', it).checked })); }

// QR
let qrStream = null, qrTimer = null;
P.qr = () => `<div class="ph"><div><h2>${t('nav.qr')}</h2><p>${t('qr.sub')}</p></div></div><div class="qrwrap"><div class="card"><video id="vid" playsinline muted autoplay hidden></video><div id="qrMsg" class="warn" hidden></div><div class="actions" style="margin-top:10px"><button class="btn p" id="qrStart">${t('qr.start')}</button><button class="btn" id="qrStop" hidden>${t('qr.stop')}</button></div></div><div class="card"><h3>${t('qr.manual')}</h3><form id="qrForm" class="toolbar" style="margin-top:8px"><input class="grow" id="qrCode" placeholder="m…"><button class="btn p">OK</button></form><p style="color:var(--muted);font-size:12.5px">${t('qr.card')}: ${t('profile')} → "${t('qr.card')}"</p></div></div>`;
P.qr_wire = () => {
  const stop = () => { if (qrTimer) clearInterval(qrTimer); qrTimer = null; if (qrStream) qrStream.getTracks().forEach(tr => tr.stop()); qrStream = null; const v = $('#vid'); if (v) { v.hidden = true; } $('#qrStart').hidden = false; $('#qrStop').hidden = true; };
  $('#qrStart').addEventListener('click', async () => { if (!('BarcodeDetector' in window) || !navigator.mediaDevices) { $('#qrMsg').hidden = false; $('#qrMsg').textContent = t('qr.unsupported'); return; } try { qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); const v = $('#vid'); v.srcObject = qrStream; v.hidden = false; $('#qrStart').hidden = true; $('#qrStop').hidden = false; const det = new BarcodeDetector({ formats: ['qr_code'] }); qrTimer = setInterval(async () => { try { const codes = await det.detect(v); if (codes.length) { const raw = codes[0].rawValue; stop(); openCode(raw); } } catch (e) {} }, 400); } catch (e) { $('#qrMsg').hidden = false; $('#qrMsg').textContent = t('qr.unsupported'); } });
  $('#qrStop').addEventListener('click', stop);
  $('#qrForm').addEventListener('submit', ev => { ev.preventDefault(); openCode($('#qrCode').value.trim()); });
  const openCode = raw => { const id = raw.replace(/^.*[#:/]/, ''); if (D.members[id]) profile(id); else if (D.members[raw]) profile(raw); else toast(t('qr.notfound')); };
};
function qrCard(m) { modal(`<div class="body" style="text-align:center"><h2>${esc(D.settings.clubName)}</h2><div style="display:inline-block;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px">${qrSvg(m.id, 180)}</div><h3 style="margin-top:10px">${esc(fullName(m))}</h3><div style="color:var(--muted)">${esc(sportName(m.sportId))} · ${esc(beltName(m.belt))}</div><div style="font-family:monospace;margin-top:6px;font-size:12px">${esc(m.id)}</div><div class="ff"><div class="right"><button class="btn" data-close>OK</button></div></div></div>`); }
function qrSvg(text, size) { try { const q = qrcode(0, 'M'); q.addData(text); q.make(); const n = q.getModuleCount(); const c = size / (n + 8); let p = ''; for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) p += `M${(x + 4) * c} ${(y + 4) * c}h${c}v${c}h-${c}z`; return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="${size}" height="${size}" fill="#fff"/><path d="${p}" fill="#000"/></svg>`; } catch (e) { return `<div class="warn">QR indisponible</div>`; } }

function exportCsv() { const h = ['Nom', 'Prénom', 'Naissance', 'Genre', 'Téléphone', 'Parent', 'Sport', 'Catégorie', 'Ceinture', 'Inscription', 'Fin abonnement', 'Statut', 'Assurance', 'Licence', 'CIN', 'Adresse', 'Code']; const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"'; const lines = [h.join(';'), ...members().map(m => [m.lastName, m.firstName, m.birthDate, m.sex, m.phone, m.parentContact, sportName(m.sportId), t(catOf(m)), beltName(m.belt), m.joinDate, m.endDate, t(subState(m).k), m.insuranceDate, m.licence, m.cin, m.address, m.id].map(q).join(';'))]; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' })); a.download = `joueurs-${today()}.csv`; document.body.appendChild(a); a.click(); a.remove(); }

// ---------- Demo ----------
function demo() {
  const S = EMPTY(); const T = today(); const h = s => { let x = 0; for (const c of s) x = (x * 31 + c.charCodeAt(0)) >>> 0; return x; };
  S.coaches = { c1: { id: 'c1', firstName: 'Hassan', lastName: 'Bouzid', sportId: 'tkd', speciality: 'Taekwondo · 4e dan', phone: '0661 11 22 33', email: '', salary: 3500 }, c2: { id: 'c2', firstName: 'Khadija', lastName: 'Amrani', sportId: 'fit', speciality: 'Fitness & Aérobic', phone: '0662 44 55 66', email: '', salary: 3000 }, c3: { id: 'c3', firstName: 'Youssef', lastName: 'Tazi', sportId: 'kick', speciality: 'Kickboxing', phone: '0663 77 88 99', email: '', salary: 2800 } };
  const first = ['Yassine', 'Salma', 'Adam', 'Lina', 'Rayane', 'Nour', 'Omar', 'Imane', 'Karim', 'Hiba', 'Ilyas', 'Aya', 'Mehdi', 'Sara', 'Anas', 'Malak', 'Hamza', 'Douae', 'Amine', 'Rim', 'Zakaria', 'Ghita', 'Bilal', 'Kenza', 'Taha', 'Nada', 'Reda', 'Wiam', 'Souhail', 'Yasmine', 'Ayoub', 'Chaima', 'Walid', 'Houda', 'Nabil', 'Ikram'];
  const last = ['Amrani', 'Bouzidi', 'El Idrissi', 'Tazi', 'Oufkir', 'Benali', 'Haddad', 'Sabri', 'Moussaoui', 'Zahiri', 'Chakir', 'Rahmani', 'Lahlou', 'Bennani', 'Ouazzani', 'Kettani', 'Fassi', 'Alaoui', 'Berrada', 'Chraibi', 'Daoudi', 'El Fassi', 'Filali', 'Guessous', 'Hajji', 'Jabri', 'Kabbaj', 'Lamrani', 'Mansouri', 'Naciri', 'Ouali', 'Qadiri', 'Rachidi', 'Saadi', 'Tahiri', 'Ziani'];
  const sports = ['tkd', 'tkd', 'tkd', 'tkd', 'fit', 'fit', 'kick', 'aero']; const quart = ['Hay Mohammadi', 'Dakhla', 'Talborjt', 'Hay Salam', 'Founty', 'Tikiouine', 'Anza', 'Bensergao'];
  for (let i = 0; i < 36; i++) {
    const id = 'm' + (1001 + i); const r = h(id); const sport = sports[r % 8]; const sex = i % 2 ? 'F' : 'M'; const a = sport === 'fit' || sport === 'aero' ? 18 + ((i * 11) % 30) : 6 + ((i * 13) % 30);
    const by = new Date().getFullYear() - a; const birth = `${by}-${pad(1 + r % 12)}-${pad(1 + r % 27)}`; const endOff = ((i * 37) % 90) - 20; const end = addDays(T, endOff); const join = addDays(T, -(30 + r % 600));
    const belt = sport === 'tkd' ? ((i * 7 + 3) % 11) : null; const ins = r % 3 === 0 ? '' : addDays(T, -(r % 400));
    S.members[id] = { id, firstName: first[i], lastName: last[(i * 7) % 36], birthDate: birth, sex, phone: a >= 16 ? `06${pad(r % 100)} ${pad(r % 97)} ${pad(r % 89)} ${pad(r % 83)}` : '', parentContact: a < 16 ? `Parent : 06${pad(r % 90)} ${pad(r % 70)} ${pad(r % 60)} ${pad(r % 50)}` : '', sportId: sport, coachId: sport === 'tkd' ? 'c1' : sport === 'kick' ? 'c3' : 'c2', belt, joinDate: join, endDate: end, insuranceDate: ins, licence: ins ? 'FRM-' + (24100 + i) : '', cin: a >= 18 ? 'JB' + (100000 + r % 900000) : '', medicalDate: addDays(join, 3), address: quart[r % 8], notes: '', archived: false, createdAt: join };
    const plan = S.settings.plans.find(p => p.sportId === sport) || S.settings.plans[r % 3]; let d = end, k = 0;
    while (k < 5 && d > addDays(T, -180)) { const start = addMonths(d, -plan.months); const pid = `pay_${id}_${k}`; S.payments[pid] = { id: pid, memberId: id, memberName: first[i] + ' ' + last[(i * 7) % 36], planId: plan.id, planName: plan.name, months: plan.months, amount: plan.price, date: start > T ? T : start, method: ['cash', 'cash', 'transfer', 'mobile'][k % 4], note: '' }; d = start; k++; }
  }
  for (let dd = 0; dd < 30; dd++) { const date = addDays(T, -dd); const dow = new Date(date + 'T00:00:00').getDay(); S.settings.sports.forEach(s => { const daysOf = s.id === 'tkd' ? [1, 3, 5] : s.id === 'kick' ? [2, 4] : [1, 2, 3, 4, 5]; if (!daysOf.includes(dow)) return; const present = Object.values(S.members).filter(m => m.sportId === s.id && h(m.id + date) % 10 < 7).map(m => m.id); S.attendance[`${date}_${s.id}`] = { date, sportId: s.id, present }; }); }
  const mo = T.slice(0, 7); const prevMo = addMonths(T.slice(0, 7) + '-01', -1).slice(0, 7);
  [[mo, 'rent', 'Loyer salle', 4000], [mo, 'salaries', 'Salaires entraîneurs', 9300], [mo, 'utilities', 'Électricité / eau', 650], [prevMo, 'rent', 'Loyer salle', 4000], [prevMo, 'salaries', 'Salaires entraîneurs', 9300], [prevMo, 'equipment', 'Protections et plastrons', 2200]].forEach(([m, c, l, a], i) => S.expenses['x' + i] = { id: 'x' + i, label: l, category: c, amount: a, date: m + '-05' });
  S.titles = { t1: { id: 't1', memberId: 'm1010', competition: 'Championnat régional Souss-Massa', rank: 'gold', date: addDays(T, -40) }, t2: { id: 't2', memberId: 'm1001', competition: 'Championnat régional Souss-Massa', rank: 'bronze', date: addDays(T, -40) }, t3: { id: 't3', memberId: 'm1010', competition: 'Coupe du Trône (cadets)', rank: 'silver', date: addDays(T, -120) } };
  S.exams = { e1: { id: 'e1', date: addDays(T, -15), examiner: 'Hassan Bouzid', title: 'Passage de grade — automne', candidates: ['m1001', 'm1002', 'm1004'].filter(x => S.members[x]).map(mid => ({ memberId: mid, from: S.members[mid].belt, to: Math.min((S.members[mid].belt ?? -1) + 1, 10), result: 'pending' })) } };
  return S;
}
